services:
  backend:
    build:
      context: .
      dockerfile: services/backend-dotnet/TelegramAi.Backend/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApplicationDb: Host=postgres;Port=5432;Database=personal_rag_agent;Username=postgres;Password=postgres
      AiService__BaseUrl: http://ai-service:8000
      AiService__TimeoutSeconds: 60
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: personal_rag_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_rag_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service-python/Dockerfile
    environment:
      # Never store the provider key in this file; inject it from the host environment.
      AI_SERVICE_MISTRAL_API_KEY: ${AI_SERVICE_MISTRAL_API_KEY:?Set AI_SERVICE_MISTRAL_API_KEY before starting Compose}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
