[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-ai-service"
version = "0.1.0"
description = "AI and RAG service for the Telegram knowledge assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "youtube-transcript-api>=0.6,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
